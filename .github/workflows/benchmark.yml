name: Benchmark Pull Request
on:
  pull_request:
    # `labeled` lets a maintainer opt a fork PR in (see the `if:` below). Once
    # `types:` is set the defaults no longer apply, so they must be listed.
    types: [opened, synchronize, reopened, labeled]
  repository_dispatch:
    types: [ reporters-db-pr ]

env:
  main: "$(/usr/bin/git log -1 --format='%H')"

# A new push supersedes any benchmark still running for the same PR, so only
# the newest commit is measured. Keyed on the PR number rather than
# `github.head_ref` (as tests.yml uses) because two forks can share a branch
# name -- `patch-1` is GitHub's default for web edits -- and would otherwise
# cancel each other. `repository_dispatch` runs have no PR number and fall
# back to a unique run id, so they never cancel one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# This workflow runs the PR's own code, so it must never hold a writable
# token: for fork PRs GitHub already forces one that is read-only, and we
# declare it here so the same is true for internal branches. Commenting and
# pushing results happen in publish-benchmark.yml, which never runs PR code.
permissions:
  contents: read

jobs:
  benchmark:
    name: Benchmark
    # Run automatically for anything pushed to this repo (all maintainers, plus
    # Dependabot) and for org members working from a personal fork. Other fork
    # PRs need a maintainer to add the `run-benchmark` label. Note that
    # `author_association` reports contribution history rather than access --
    # Dependabot reports CONTRIBUTOR -- so the head-repo check is what keeps
    # everyone with write access running automatically. #332
    #
    # The `labeled` clause keeps an unrelated label from re-running the
    # benchmark: `labeled` fires for every label, so on a PR that already
    # passes the gate below, adding `bug` triggered a full re-run -- and with
    # `cancel-in-progress` that cancels the in-flight benchmark rather than
    # merely duplicating it. It has to be `action != 'labeled' || ...` rather
    # than a plain equality, because `github.event.label` is absent on
    # opened/synchronize/reopened; comparing it there would be false and the
    # benchmark would only ever run on labeling.
    if: >-
      github.event_name == 'pull_request'
      && (github.event.action != 'labeled'
      || github.event.label.name == 'run-benchmark')
      && (github.event.pull_request.head.repo.full_name == github.repository
      || github.event.pull_request.author_association == 'MEMBER'
      || github.event.pull_request.author_association == 'OWNER'
      || contains(github.event.pull_request.labels.*.name, 'run-benchmark'))
    runs-on: ubuntu-latest
    # Runs have never exceeded 4m; this caps a hung or hostile one well short
    # of the 6 hour default while leaving room for a slow runner.
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "0.7.x"

      - name: Install Python dependencies
        run: |
          uv sync --frozen --no-group dev --group benchmark
          source .venv/bin/activate
          echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV

      # branch1 = the PR (the repo is checked out at the PR ref here, so
      # `env.main` resolves to the PR head sha). The baseline (main) is
      # captured later as branch2, after we check main out.
      - name: Setup variables I
        id: branch1
        run: |
          echo ${{ github.event.issue.pull_request }}
          echo "filepath=benchmark/${{ env.main }}.json" >> "$GITHUB_OUTPUT"
          echo "hash=${{ env.main }}" >> "$GITHUB_OUTPUT"
      #----------------------------------------------
      #             Download Testing File
      #
      # We generated our testing datasets with the following command:
      #
      # root@maintenance:/opt/courtlistener# PGPASSWORD=$DB_PASSWORD psql \
      #   --host $DB_HOST \
      #   --username $DB_USER \
      #   --dbname courtlistener \
      #   --command \
      #     'set statement_timeout to 0;
      #      COPY (
      #        SELECT \
      #          id, plain_text, html, html_lawbox, html_columbia, html_anon_2020, xml_harvard \
      #        FROM \
      #          search_opinion \
      #        TABLESAMPLE BERNOULLI (0.1) \
      #      ) \
      #      TO STDOUT \
      #      WITH (FORMAT csv, ENCODING utf8, HEADER); \
      #     ' \
      #   | bzip2 \
      #   | aws s3 cp - s3://com-courtlistener-storage/bulk-data/eyecite/tests/ten-percent.csv.bz2 \
      #      --acl public-read
      #----------------------------------------------
      - name: Download Testing File
        run: |
          curl https://storage.courtlistener.com/bulk-data/eyecite/tests/one-percent.csv.bz2 --output benchmark/bulk-file.csv.bz2

      - name: Run first benchmark
        run: |
          python benchmark/benchmark.py --branches ${{ steps.branch1.outputs.hash }}
          # Preserve the PR's benchmark.py outside the working tree: the next
          # step checks out main (clean: true), which would otherwise replace
          # this script with main's version. The second run needs main's
          # eyecite *library* for the baseline, but the PR's *script* so its
          # report/CLI changes (e.g. --base) actually run.
          cp benchmark/benchmark.py "$RUNNER_TEMP/benchmark.py"
          git stash --include-untracked

      - uses: actions/checkout@v5
        with:
          repository: freelawproject/eyecite
          ref: main

      - name: Install dependencies 2
        run: uv sync --frozen --no-group dev --group benchmark

      # branch2 = main (we just checked it out above), i.e. the baseline.
      - name: Setup variables II
        id: branch2
        run: |
          echo "filepath=benchmark/${{ env.main }}.json" >> "$GITHUB_OUTPUT"
          echo "hash=${{ env.main }}" >> "$GITHUB_OUTPUT"

      # Pass --base so gains/losses are oriented against main regardless of
      # the order the two hashes appear in --branches.
      - name: Run second benchmark
        run: |
          git stash pop
          # Restore the PR's benchmark.py over main's checkout so the report
          # generation and the --base flag come from the PR, not from main.
          cp "$RUNNER_TEMP/benchmark.py" benchmark/benchmark.py
          python benchmark/benchmark.py --branches ${{ steps.branch1.outputs.hash }} ${{ steps.branch2.outputs.hash }} --base ${{ steps.branch2.outputs.hash }} --pr ${{ github.event.number }}
          mkdir results
          mv benchmark/output.csv benchmark/${{ steps.branch1.outputs.hash }}.json benchmark/${{ steps.branch2.outputs.hash }}.json benchmark/report.md benchmark/chart.png results/

      #----------------------------------------------
      #             Hand off to publish-benchmark.yml
      #
      # We cannot comment or push from here: this job has a read-only token by
      # design. Upload the results instead; publish-benchmark.yml picks them up
      # on `workflow_run` and does the privileged half.
      #
      # The PR number travels inside the artifact because
      # `github.event.workflow_run.pull_requests` is empty for fork PRs.
      #----------------------------------------------
      - name: Record PR number for the publish workflow
        run: echo "${{ github.event.number }}" > results/pr-number.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: results/
          retention-days: 7
          if-no-files-found: error

  dispatch:
    name: Reporters-DB-Dipatch
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "0.7.x"

      - name: Add or Update comment on PR that Test is running
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          recreate: true
          GITHUB_TOKEN: ${{ secrets.FREELAWBOT_TOKEN }}
          number: ${{ github.event.client_payload.pr_number }}
          repo: reporters-db
          message: |
            Eyecite Benchmarking in progress ...
            This message will be updated when the test is completed.

      - name: Install Python dependencies
        run: |
          uv sync --frozen --no-group dev --group benchmark
          source .venv/bin/activate
          echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV

      - name: Run Tests
        run: |
          uv pip install "git+https://github.com/freelawproject/reporters-db.git"
          echo ${{ github.event.client_payload.pr_number }}
          curl https://storage.courtlistener.com/bulk-data/eyecite/tests/one-percent.csv.bz2 --output benchmark/bulk-file.csv.bz2
          python benchmark/benchmark.py --branches original
          uv pip install "git+https://github.com/freelawproject/reporters-db.git@${{ github.event.client_payload.commit }}"
          # "original" is the baseline; "update" is the reporters-db PR.
          python benchmark/benchmark.py --branches original update --base original --reporters --pr ${{ github.event.client_payload.pr_number }}
          mkdir results
          mv benchmark/output.csv benchmark/original.json benchmark/update.json benchmark/report.md benchmark/chart.png results/

      - name: Pushes test file
        # Pinned to a commit: `@main` is a mutable ref, and this is the step
        # that receives FREELAWBOT_TOKEN. The SHA below is what `main` has
        # resolved to since 2022-02-04, so this changes nothing behaviourally.
        uses: dmnemec/copy_file_to_another_repo_action@bbebd3da22e4a37d04dca5f782edd5201cb97083 # main @ 2022-02-04
        env:
          API_TOKEN_GITHUB: ${{ secrets.FREELAWBOT_TOKEN }}
        with:
          user_email: 'info@free.law'
          user_name: 'freelawbot'
          source_file: 'results/'
          destination_repo: 'freelawproject/reporters-db'
          destination_folder: '${{ github.event.client_payload.pr_number }}'
          destination_branch: 'artifacts'
          commit_message: 'feat(ci): Add artifacts for PR #${{ github.event.client_payload.pr_number }}'

      - name: Add or Update PR Comment from Generated Report
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          recreate: true
          GITHUB_TOKEN: ${{ secrets.FREELAWBOT_TOKEN }}
          path: results/report.md
          number: ${{ github.event.client_payload.pr_number }}
          repo: reporters-db
