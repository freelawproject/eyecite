version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    # We only use dependabot for security updates since this is a library. See
    # https://github.com/freelawproject/eyecite/issues/42 for more discussion.
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    # Skip the changelog check (check_changelog.yml) for CI-only bumps. Setting
    # `labels` replaces Dependabot's defaults, so they're listed explicitly.
    labels:
      - "dependencies"
      - "github_actions"
      - "no changelog"
    schedule:
      interval: monthly
    groups:
      core:
        patterns:
          - 'actions/*' # The core actions offered by Github
